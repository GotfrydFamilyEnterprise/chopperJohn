<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#12283b"><title>Terrain Lab · ChopperJohn</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#12283b;color:#edf4ed;font:14px system-ui;height:100dvh;display:flex;flex-direction:column}button,select,summary,a{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}button,select,.back,summary{border:1px solid #54716e;background:#213e49;color:#edf4ed;border-radius:9px;padding:9px 12px;font:inherit;min-height:40px;touch-action:manipulation}button:disabled{opacity:.45}button{cursor:pointer}header{display:flex;align-items:center;gap:10px;padding:8px max(12px,env(safe-area-inset-right)) 4px max(12px,env(safe-area-inset-left));flex-wrap:wrap}h1{font-size:17px;margin:0}small{font-size:11px;color:#adc6c5}a{color:#cbe6de;text-decoration:none}.back{margin-left:auto}.toolbar{display:flex;gap:7px;align-items:center;padding:6px 12px;flex-wrap:wrap}label{display:flex;gap:6px;align-items:center}select{max-width:180px}#stage{position:relative;flex:1;min-height:170px;overflow:hidden}canvas{width:100%;height:100%;display:block;touch-action:none}#caption{position:absolute;top:12px;left:14px;right:14px;pointer-events:none;max-width:600px;color:#c9dbd6;font-size:13px;line-height:1.4}#caption strong{display:block;color:#fff;font-size:16px;margin-bottom:3px}footer{padding:7px 12px calc(8px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#172f3c;font-size:12px;color:#c1d8d0}#status{flex:1}#jsonPanel{position:absolute;inset:8px;z-index:3;background:#132d3b;border:1px solid #708e89;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}#jsonPanel[hidden]{display:none}textarea{flex:1;min-height:100px;resize:none;background:#0c2230;color:#d5e8dc;border:1px solid #69817d;border-radius:5px;padding:8px;font:12px monospace;user-select:text;-webkit-user-select:text}#error{color:#ffd39d;margin:0;white-space:pre-wrap}.jsonActions{display:flex;gap:8px;flex-wrap:wrap}.hint{margin:0;color:#abc6c2;font-size:12px}#eventLog{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#sight{accent-color:#9bc9b6}button[aria-pressed=true]{background:#456b5e}@media(max-width:500px){header{gap:7px}header small{display:none}.toolbar{gap:5px;padding:4px 8px}button,select{padding:7px 9px;font-size:12px}select{max-width:137px}#caption{font-size:12px}footer{gap:6px}h1{font-size:15px}}@media(max-height:470px){header{padding-top:4px}header small{display:none}.toolbar{padding-top:2px;padding-bottom:3px}button,select,.back{min-height:33px;padding:5px 9px}#caption{font-size:11px;max-width:460px;top:6px}#caption strong{font-size:13px;margin:0}footer{padding-top:4px;padding-bottom:4px}}
#combatReport{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:4px 12px 7px;font-size:11px;color:#d6e7dc}#blueReport{color:#a9e8fb}#redReport{color:#ffc0b4}#outcome{color:#e7ce98}#combatReport span{white-space:nowrap}@media(max-height:470px){#combatReport{padding:2px 12px;font-size:10px}}
</style></head><body>
<header><h1>Terrain Lab</h1><small>Playground v0.2 · experimental</small><a class="back" href="./battlefield.html">Battlefield ↗</a></header>
<div class="toolbar"><select id="level" aria-label="Terrain level"><option value="ridge">Ridgeline</option><option value="valley">Valley</option><option value="bumps">Rolling ground</option></select><select id="scenario" aria-label="Experiment"></select><button id="run" disabled>Run</button><button id="step" disabled>+1 second</button><button id="fineStep" disabled>+0.1s</button><select id="speed" aria-label="Simulation speed"><option value="1">1× speed</option><option value="0.5">½ speed</option><option value="0.25">¼ speed</option></select><button id="reset" disabled>Reset</button><button id="json" disabled>Level JSON</button></div>
<div id="combatReport"><span id="blueReport"></span><span id="redReport"></span><strong id="outcome" role="status"></strong></div>
<main id="stage"><canvas id="canvas" aria-label="Terrain simulation"></canvas><div id="caption"><strong>Loading terrain…</strong></div><section id="jsonPanel" hidden aria-label="Level JSON editor"><b>Make a level</b><p class="hint">Terrain points are [x, elevation]. Positive rises above the baseline; negative makes a valley. Apply starts a fresh, paused simulation.</p><textarea id="source" aria-label="Level JSON" spellcheck="false"></textarea><p id="error" role="alert"></p><div class="jsonActions"><button id="apply">Apply JSON</button><button id="download">Download</button><label><input id="upload" type="file" accept=".json,application/json" hidden><button id="import">Import file</button></label><button id="closeJson">Close</button></div></section></main>
<footer><label><input id="sight" type="checkbox" checked>Sight lines</label><button id="zoom" aria-pressed="false">Zoom in</button><span id="status" aria-live="off">Loading…</span><span id="eventLog"></span><span class="hint">Drag to pan when zoomed · green: visible · amber: hidden</span></footer>
<script type="module" src="./js/battlefield/terrain/scene.js?v=0.2.0"></script></body></html>

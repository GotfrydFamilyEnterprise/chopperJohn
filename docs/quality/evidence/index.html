<!doctype html><meta name="viewport" content="width=device-width, initial-scale=1"><title>Issue #1 mobile evidence</title><style>body{max-width:820px;margin:auto;padding:16px;background:#101b2c;color:#eef7ff;font:16px system-ui}img{width:100%;max-width:390px;border:1px solid #79946c}figure{margin:20px 0}a{color:#a5dfff}</style><h1>FOB browser evidence</h1><p>390 × 844 Chromium viewport. Local branch captures; deployment and physical iPhone acceptance remain separate checks.</p><div id="gallery"></div><script>for(const team of [0,1])for(const [suffix,label] of [['empty','Empty, flag down'],['stage-1','First rifle arrived'],['stage-2','Rocket arrived, flag down'],['stage-3','Third arrival, occupation begins'],['occupied','Three defenders, raised flag'],['vacancy','Defender casualty, flag lowered'],['replacement','Replacement arrived, flag raised again']]){const f=document.createElement('figure');f.innerHTML=`<figcaption>${team===0?'Blue':'Red'}: ${label}</figcaption><a href="team-${team}-${suffix}.png"><img loading="lazy" src="team-${team}-${suffix}.png"></a>`;document.getElementById('gallery').append(f);}</script>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1728">
<title>ChopperJohn | Flight School</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}html,body{padding:0;margin:0;width:100%;height:100%;overflow:hidden;background:#0b1728;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100vw;height:100dvh;touch-action:none}
#hud{pointer-events:none;position:fixed;inset:0;color:#eff7ff}
#bar{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 14px 0;font-size:13px;text-shadow:0 1px 3px #000}
#lesson{padding:8px 11px;border:1px solid #ffffff44;background:#0b1728c9;border-radius:12px;max-width:min(68vw,480px)}
#lesson strong{display:block;font-size:15px;margin-bottom:4px}
#stats{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
#controls{position:fixed;inset:0;pointer-events:none}
.pad{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 18px);pointer-events:auto;touch-action:none}
#stick{left:18px;width:134px;height:134px;border:2px solid #ffffff65;border-radius:50%;background:#1935509c}
#knob{position:absolute;left:45px;top:45px;width:40px;height:40px;border-radius:50%;background:#b9e5ffb8;border:2px solid white;box-shadow:0 0 16px #62b6fc55}
#fire{right:22px;bottom:calc(env(safe-area-inset-bottom) + 34px);width:96px;height:96px;border-radius:50%;background:#ca4d4da6;border:2px solid #ffb3b3;color:white;font-weight:800;font-size:17px}
#turn{right:132px;bottom:calc(env(safe-area-inset-bottom) + 52px);width:78px;height:78px;border-radius:50%;background:#316d9ebd;border:2px solid #afdfff;color:white;font-size:13px;font-weight:800}
#reset{position:fixed;top:calc(env(safe-area-inset-top) + 98px);right:12px;border:1px solid #ffffff77;border-radius:9px;padding:7px 11px;background:#112843db;color:white;pointer-events:auto}
#telemetryToggle{position:fixed;top:calc(env(safe-area-inset-top) + 137px);right:12px;border:1px solid #ffffff77;border-radius:9px;padding:7px 11px;background:#112843db;color:white;pointer-events:auto}
#telemetry{position:fixed;top:calc(env(safe-area-inset-top) + 14px);left:50%;transform:translateX(-50%);white-space:pre;background:#071c31da;border:1px solid #9fcaff77;border-radius:9px;padding:8px 11px;font:12px ui-monospace,monospace;color:#d6f0ff;pointer-events:none}
#telemetry[hidden]{display:none}
#tip{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 12px);font-size:11px;color:#b8cfe3;white-space:nowrap;pointer-events:none}
@media (max-height:430px){#stick{width:112px;height:112px}#knob{left:36px;top:36px;width:36px;height:36px}#fire{width:80px;height:80px;right:20px}#turn{width:67px;height:67px;right:111px;bottom:calc(env(safe-area-inset-bottom) + 40px);font-size:11px}#reset{top:calc(env(safe-area-inset-top) + 70px)}#telemetryToggle{top:calc(env(safe-area-inset-top) + 108px)}#telemetry{top:calc(env(safe-area-inset-top) + 2px);font-size:10px;padding:5px 7px}#bar{font-size:11px}#lesson strong{font-size:13px}#tip{display:none}}
</style>
</head>
<body>
<canvas id="game" aria-label="Helicopter flying tutorial"></canvas>
<div id="hud"><div id="bar"><div id="lesson"><strong id="title">Flight school</strong><span id="instruction">Move the left stick to fly.</span></div><div id="stats">00:00<br>0 targets</div></div></div>
<div id="controls"><div class="pad" id="stick" aria-label="Flight joystick"><div id="knob"></div></div><button class="pad" id="turn" aria-label="Turn helicopter around">↻ TURN</button><button class="pad" id="fire" aria-label="Fire machine gun">FIRE</button><button id="reset">Restart</button><a id="battleLink" href="./battlefield.html" style="position:fixed;left:12px;top:calc(env(safe-area-inset-top) + 12px);z-index:10;background:#205875;color:#fff;border:1px solid #9bd6f1;border-radius:8px;padding:7px 10px;text-decoration:none;font-size:12px;pointer-events:auto">Battlefield →</a><button id="telemetryToggle" aria-pressed="false">Telemetry: off</button></div><div id="telemetry" hidden></div>
<div id="tip">Joystick: pitch + lift · TURN: face opposite way · FIRE · Desktop: arrows + T + Space</div>
<script>
(()=>{
"use strict";
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
const title=document.getElementById("title"),instruction=document.getElementById("instruction"),stats=document.getElementById("stats");
const stick=document.getElementById("stick"),knob=document.getElementById("knob"),fire=document.getElementById("fire");
const WORLD={w:1800,h:680,ground:605},DT=1/60;
let w=innerWidth,h=innerHeight,dpr=1,scale=1,camera=0,elapsed=0,acc=0,last=0,visualTime=0,telemetryOn=false;
const keys=new Set(),axis={x:0,y:0};let fireHeld=false,stickId=null,fireId=null;
let heli,shots,targets,lesson,steps,crashed,done;
const FLIGHT={maxPitch:.61,rotorRate:12,bodyRate:3.7,thrust:395,gravity:330,horizontalDamping:.45,verticalDamping:.9,maxHorizontal:270,maxVertical:200};
const telem=document.getElementById("telemetry"),telemToggle=document.getElementById("telemetryToggle");
function apparentFacing(){const progress=heli.turnTime>0?1-heli.turnTime/.42:1;return heli.turnTime>0?heli.turnFrom*Math.cos(Math.PI*progress):heli.facing;}
function reset(){
 heli={x:160,y:300,vx:0,vy:0,facing:1,angle:0,rotorAngle:0,turnTime:0,turnFrom:1,health:100,fireCooldown:0};
 shots=[]; targets=[{x:970,y:WORLD.ground-24,hp:3},{x:1250,y:WORLD.ground-24,hp:3},{x:1520,y:WORLD.ground-24,hp:3}];
 lesson=0;steps={move:0,climb:0,travel:false,fire:0,land:0};crashed=false;done=false;elapsed=0;acc=0;updateHUD();
}
function resize(){w=innerWidth;h=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);canvas.style.width=w+"px";canvas.style.height=h+"px";scale=Math.min(w/820,h/440);scale=Math.max(.48,scale);}
function clamp(n,a,b){return Math.max(a,Math.min(b,n));}
function requestTurn(){
 if(crashed||done||heli.turnTime>0)return;
 heli.turnFrom=heli.facing;
 heli.facing=-heli.facing;
 heli.turnTime=.42;
 // A turnaround affects the aircraft's orientation, not its world-space velocity.
}
function step(dt){
 if(crashed||done)return;
 elapsed+=dt;
 const ax=clamp(axis.x+(keys.has("ArrowRight")||keys.has("KeyD")?1:0)-(keys.has("ArrowLeft")||keys.has("KeyA")?1:0),-1,1);
 const ay=clamp(axis.y+(keys.has("ArrowDown")||keys.has("KeyS")?1:0)-(keys.has("ArrowUp")||keys.has("KeyW")?1:0),-1,1);
 const steer=clamp(ax,-1,1),lift=clamp(ay,-1,1);
 // Joystick X changes nose pitch relative to the direction the aircraft faces.
 // Facing right: left = nose up, right = nose down.
 // Facing left: right = nose up, left = nose down.
 // Angle is nose-down positive, independent of facing; sprite X is mirrored.
 const requestedPitch=clamp(steer*heli.facing,-1,1)*FLIGHT.maxPitch;
 // Cyclic disc responds first; the heavier fuselage slowly follows its thrust direction.
 heli.rotorAngle+=(requestedPitch-heli.rotorAngle)*(1-Math.exp(-FLIGHT.rotorRate*dt));
 heli.angle+=(heli.rotorAngle-heli.angle)*(1-Math.exp(-FLIGHT.bodyRate*dt));
 // Up requests greater collective, down less. Neutral returns to hover trim.
 // Horizontal acceleration follows the nose orientation and keeps inertia.
 const collective=clamp(1-lift*.80,.20,1.80);
 // Rotor thrust resolves into horizontal and vertical forces. Neutral collective
 // hovers when level, but loses altitude as rotor-disc tilt increases.
 const horizontalAcceleration=heli.facing*Math.sin(heli.rotorAngle)*FLIGHT.thrust*collective;
 const verticalAcceleration=FLIGHT.gravity*(1-collective*Math.cos(heli.rotorAngle));
 heli.vx=(heli.vx+horizontalAcceleration*dt)*Math.exp(-FLIGHT.horizontalDamping*dt);
 heli.vy=(heli.vy+verticalAcceleration*dt)*Math.exp(-FLIGHT.verticalDamping*dt);
 if(heli.turnTime>0)heli.turnTime=Math.max(0,heli.turnTime-dt);
 heli.vx=clamp(heli.vx,-FLIGHT.maxHorizontal,FLIGHT.maxHorizontal);heli.vy=clamp(heli.vy,-FLIGHT.maxVertical,FLIGHT.maxVertical);
 heli.x=clamp(heli.x+heli.vx*dt,25,WORLD.w-25);
 heli.y=clamp(heli.y+heli.vy*dt,45,WORLD.ground-23);
 // Facing direction changes only after the explicit turnaround gesture.
 if(heli.y>=WORLD.ground-23 && Math.abs(heli.vy)>95){heli.health=Math.max(0,heli.health-35);heli.vy=0;if(heli.health===0)crashed=true;}
 if(heli.y<=45||heli.y>=WORLD.ground-23)heli.vy=0;
 heli.fireCooldown=Math.max(heli.fireCooldown-dt,0);
 if((fireHeld||keys.has("Space"))&&heli.fireCooldown<=0){
  // Match the exact rendered body direction (including pitch and turnaround).
  const visibleFacing=apparentFacing();
  const ca=Math.cos(heli.angle),sa=Math.sin(heli.angle);
  const forwardX=visibleFacing*ca,forwardY=sa;
  const length=Math.hypot(forwardX,forwardY);
  if(length>0.001){
   const ux=forwardX/length,uy=forwardY/length;
   // Gun muzzle local position (36,4), transformed like the fuselage.
   const muzzleX=heli.x+visibleFacing*(36*ca-4*sa);
   const muzzleY=heli.y+36*sa+4*ca;
   shots.push({x:muzzleX,y:muzzleY,vx:ux*680+heli.vx,vy:uy*680+heli.vy,ttl:1.2});
   steps.fire++;
  }
  heli.fireCooldown+=.125; // 8 rounds per second for a held FIRE button.
 }
 shots.forEach(s=>{s.x+=s.vx*dt;s.y+=s.vy*dt;s.ttl-=dt;for(const t of targets){if(t.hp>0&&Math.abs(s.x-t.x)<21&&Math.abs(s.y-t.y)<30){t.hp--;s.ttl=0;break;}}});
 shots=shots.filter(s=>s.ttl>0);
 if(Math.abs(steer)>.2||Math.abs(lift)>.2)steps.move+=dt;
 if(heli.y<190)steps.climb+=dt;
 if(heli.x>720)steps.travel=true;
 if(lesson===0&&steps.move>2)lesson=1;
 if(lesson===1&&steps.climb>1)lesson=2;
 if(lesson===2&&steps.travel)lesson=3;
 if(lesson===3&&targets.every(t=>t.hp<=0))lesson=4;
 if(lesson===4&&heli.x<280&&heli.y>WORLD.ground-82&&Math.abs(heli.vx)<45&&Math.abs(heli.vy)<45){steps.land+=dt;if(steps.land>1.3){lesson=5;done=true;}}else steps.land=0;
 updateHUD();
}
function updateHUD(){
 const text=[
 ["Lesson 1 / 5 · Flight controls","Use the joystick to fly. Move for two seconds."],
 ["Lesson 2 / 5 · Climb","Push the joystick up to climb above the dashed line."],
 ["Lesson 3 / 5 · Navigation","Pitch nose down (right on stick) to accelerate right. Use TURN to face the other direction."],
 ["Lesson 4 / 5 · Combat","Face the targets and use FIRE. Destroy all three."],
 ["Lesson 5 / 5 · Return to base","Fly left and land gently on the blue helipad."],
 ["Mission complete!","You passed flight school. Tap Restart to fly again."]
 ];
 title.textContent=text[lesson][0];instruction.textContent=text[lesson][1];
 stats.textContent=Math.floor(elapsed/60).toString().padStart(2,"0")+":"+Math.floor(elapsed%60).toString().padStart(2,"0")+"  ·  Hull "+heli.health+"%  ·  Targets "+targets.filter(t=>t.hp>0).length+(crashed?"  ·  CRASHED":"");
 if(crashed){title.textContent="Helicopter lost";instruction.textContent="Tap Restart to try again.";}
}
function render(){
 ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);
 const sy=Math.max(0,(h-WORLD.h*scale)*.5),sx=scale;camera=clamp(heli.x-w/(2*sx),0,Math.max(0,WORLD.w-w/sx));
 ctx.fillStyle="#122a46";ctx.fillRect(0,0,w,h);
 ctx.save();ctx.translate(0,sy);ctx.scale(sx,sx);ctx.translate(-camera,0);
 const visible=w/sx;
 ctx.fillStyle="#1d4262";for(let i=0;i<20;i++){const px=i*125;ctx.beginPath();ctx.ellipse(px,470+(i%3)*16,95,76,0,0,Math.PI*2);ctx.fill();}
 ctx.strokeStyle="#7dacc455";ctx.setLineDash([14,14]);ctx.beginPath();ctx.moveTo(camera,190);ctx.lineTo(camera+visible,190);ctx.stroke();ctx.setLineDash([]);
 ctx.fillStyle="#42644a";ctx.fillRect(camera,WORLD.ground,visible,100);
 ctx.fillStyle="#63866a";ctx.fillRect(camera,WORLD.ground,visible,10);
 ctx.fillStyle="#356ea7";ctx.fillRect(50,WORLD.ground-7,230,7);
 ctx.fillStyle="#b8e8ff";ctx.font="16px system-ui";ctx.fillText("BASE / LAND HERE",57,WORLD.ground-15);
 for(const t of targets){if(t.hp<=0){ctx.fillStyle="#4e4e4e";ctx.fillRect(t.x-16,WORLD.ground-12,32,12);continue;}
 ctx.fillStyle="#d08b44";ctx.fillRect(t.x-19,t.y-10,38,24);ctx.fillStyle="#e8ae64";ctx.fillRect(t.x-8,t.y-19,16,10);ctx.fillStyle="#331b16";ctx.fillRect(t.x-6,t.y-24,28,5);
 ctx.fillStyle="#f2d9a0";ctx.font="14px system-ui";ctx.fillText("HP "+t.hp,t.x-18,t.y-31);}
 ctx.save();ctx.translate(heli.x,heli.y);
 // During the 420ms turn, the visible fuselage narrows as if yawing in 3D,
 // briefly showing its nose or tail before growing into the opposite side view.
 const facingScale=apparentFacing();
 ctx.scale(facingScale,1);
 ctx.rotate(heli.angle);
 // The mast and the rotor disc have their own animation independent of body pitch.
 ctx.fillStyle="#bcd3de";ctx.fillRect(-2,-31,4,10);
 ctx.fillStyle="#57b7cf";ctx.beginPath();ctx.moveTo(-28,-7);ctx.lineTo(19,-7);ctx.quadraticCurveTo(39,-5,34,9);ctx.lineTo(-18,12);ctx.closePath();ctx.fill();
 ctx.fillStyle="#143e5b";ctx.beginPath();ctx.ellipse(17,0,13,8,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#57b7cf";ctx.fillRect(-47,0,20,4);ctx.fillRect(-46,-8,3,16);
 ctx.strokeStyle="#d6eeff";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-15,17);ctx.lineTo(23,17);ctx.moveTo(-10,11);ctx.lineTo(-10,17);ctx.moveTo(16,11);ctx.lineTo(16,17);ctx.stroke();
 // Draw a spinning, foreshortened main rotor above the fuselage.
 // Disc deflection is the *difference* between rotor cyclic angle and fuselage pitch.
 ctx.save();ctx.translate(0,-34);ctx.rotate(heli.rotorAngle-heli.angle);
 ctx.fillStyle="#c5eafa3d";ctx.beginPath();ctx.ellipse(0,0,70,7,0,0,Math.PI*2);ctx.fill();
 const phase=visualTime*31,blade=Math.cos(phase),depth=Math.sin(phase);
 ctx.strokeStyle="#e4f7ffbb";ctx.lineWidth=2.8;ctx.beginPath();
 ctx.moveTo(-67*blade,-5*depth);ctx.lineTo(67*blade,5*depth);ctx.stroke();
 ctx.strokeStyle="#c6e9ff66";ctx.lineWidth=1.8;ctx.beginPath();
 ctx.moveTo(-64*Math.cos(phase+1.1),-5*Math.sin(phase+1.1));
 ctx.lineTo(64*Math.cos(phase+1.1),5*Math.sin(phase+1.1));ctx.stroke();
 ctx.fillStyle="#f1faff";ctx.beginPath();ctx.arc(0,0,4,0,Math.PI*2);ctx.fill();
 ctx.restore();
 // Tail rotor: rotating spokes, seen from the side.
 ctx.save();ctx.translate(-47,0);ctx.rotate(visualTime*40);
 ctx.strokeStyle="#d5f2ffcc";ctx.lineWidth=2;
 ctx.beginPath();ctx.moveTo(-9,0);ctx.lineTo(9,0);ctx.moveTo(0,-9);ctx.lineTo(0,9);ctx.stroke();
 ctx.restore();
 ctx.restore();
 ctx.fillStyle="#fff1a0";shots.forEach(s=>ctx.fillRect(s.x-4,s.y-2,8,4));
 ctx.restore();
 if(done||crashed){ctx.fillStyle="#071526af";ctx.fillRect(0,0,w,h);ctx.fillStyle="white";ctx.textAlign="center";ctx.font="bold 25px system-ui";ctx.fillText(done?"FLIGHT SCHOOL COMPLETE":"HELICOPTER LOST",w/2,h*.43);ctx.font="16px system-ui";ctx.fillText("Tap Restart to try again",w/2,h*.52);ctx.textAlign="start";}
}
function loop(now){
 const dt=Math.min((now-last)/1000||0,.05);last=now;visualTime+=dt;
 acc=Math.min(acc+dt,.2);while(acc>=DT){step(DT);acc-=DT;}
 render();
 if(telemetryOn){
  const deg=180/Math.PI;
  telem.textContent="PITCH "+(heli.angle*deg).toFixed(1)+"°  ROTOR "+(heli.rotorAngle*deg).toFixed(1)+"°\n"+
   "VX "+heli.vx.toFixed(1)+"   VY "+heli.vy.toFixed(1)+" units/s\n"+
   "ALT "+(WORLD.ground-heli.y).toFixed(0)+"   LIFT "+clamp(1-axis.y*.8,.2,1.8).toFixed(2)+"x";
 }
 requestAnimationFrame(loop);
}
function joystick(x,y){const b=stick.getBoundingClientRect(),cx=b.left+b.width/2,cy=b.top+b.height/2,r=(b.width-42)/2;const dx=x-cx,dy=y-cy,length=Math.hypot(dx,dy),fraction=length?Math.min(1,r/length):0;axis.x=dx*fraction/r;axis.y=dy*fraction/r;knob.style.transform="translate("+(axis.x*r)+"px,"+(axis.y*r)+"px)";}
function stopStick(){stickId=null;axis.x=0;axis.y=0;knob.style.transform="translate(0,0)";}
stick.addEventListener("pointerdown",e=>{e.preventDefault();stickId=e.pointerId;stick.setPointerCapture(e.pointerId);joystick(e.clientX,e.clientY);});
stick.addEventListener("pointermove",e=>{if(e.pointerId===stickId)joystick(e.clientX,e.clientY);});
for(const name of ["pointerup","pointercancel","lostpointercapture"])stick.addEventListener(name,e=>{if(e.pointerId===stickId)stopStick();});
fire.addEventListener("pointerdown",e=>{e.preventDefault();fireId=e.pointerId;fire.setPointerCapture(e.pointerId);fireHeld=true;});
for(const name of ["pointerup","pointercancel","lostpointercapture"])fire.addEventListener(name,e=>{if(e.pointerId===fireId){fireId=null;fireHeld=false;}});
addEventListener("keydown",e=>{if(["ArrowRight","ArrowLeft","ArrowUp","ArrowDown","Space"].includes(e.code))e.preventDefault();keys.add(e.code);});
addEventListener("keyup",e=>keys.delete(e.code));
addEventListener("blur",()=>{keys.clear();stopStick();fireHeld=false;});
document.getElementById("turn").addEventListener("pointerdown",e=>{e.preventDefault();requestTurn();});
document.getElementById("reset").addEventListener("click",reset);
telemToggle.addEventListener("click",()=>{telemetryOn=!telemetryOn;telem.hidden=!telemetryOn;telemToggle.textContent="Telemetry: "+(telemetryOn?"on":"off");telemToggle.setAttribute("aria-pressed",String(telemetryOn));});
 // Desktop testing shortcut.
 addEventListener("keydown",e=>{if(e.code==="KeyT"&&!e.repeat)requestTurn();});
addEventListener("resize",resize);
resize();reset();requestAnimationFrame(loop);
})();
</script>
</body>
</html>

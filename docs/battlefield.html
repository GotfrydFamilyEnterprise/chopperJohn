<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><title>ChopperJohn | Battlefield</title>
<link rel="manifest" href="./battlefield.webmanifest"><meta name="theme-color" content="#101b2c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="ChopperJohn">
<style>
*{box-sizing:border-box}html,body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;margin:0;height:100%;overflow:hidden;background:#101b2c;font-family:system-ui,-apple-system,sans-serif;color:#eef7ff;touch-action:none}canvas{display:block;width:100vw;height:100dvh;touch-action:none}
button,a{touch-action:manipulation}button{border:1px solid #93bdd166;border-radius:10px;background:#163b55ed;color:#eef7ff;padding:10px 12px;font:600 13px system-ui}button:disabled{opacity:.4}button.active{border-color:#ffd577;color:#ffe4a0}a{color:#b8e1ff}button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid #ffe4a0;outline-offset:3px}
#battleHUD{position:fixed;top:calc(env(safe-area-inset-top) + 8px);left:calc(env(safe-area-inset-left) + 12px);max-width:calc(100vw - env(safe-area-inset-left) - env(safe-area-inset-right) - 76px);display:flex;gap:5px;align-items:center;pointer-events:none;font-variant-numeric:tabular-nums}
#economies{display:flex;gap:5px}#economies>div,#pilotStatus{font-size:10px;line-height:16px;white-space:nowrap;border-radius:5px;padding:3px 6px;background:#0b1727c9;border:1px solid #91aec72b}#blueEconomy{color:#a4d8ff}#redEconomy{color:#ffb6b6}#pilotStatus{color:#d3efdd}
#gameMenu{position:fixed;z-index:5;top:calc(env(safe-area-inset-top) + 6px);right:calc(env(safe-area-inset-right) + 10px)}#menuToggle{list-style:none;display:grid;place-items:center;width:44px;height:36px;border:1px solid #93bdd166;border-radius:8px;background:#0b1727e8;font-size:22px;cursor:pointer;touch-action:manipulation}#menuToggle::-webkit-details-marker{display:none}
#menuPanel{position:absolute;right:0;top:42px;width:240px;max-height:calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom) - 62px);overflow:auto;overscroll-behavior:contain;touch-action:pan-y;border:1px solid #91aec755;border-radius:12px;background:#0b1727f7;padding:12px;box-shadow:0 12px 35px #0008}#menuPanel header{font-size:12px;margin-bottom:8px;color:#cee7f5}#tools{display:grid;grid-template-columns:1fr 1fr;gap:6px}#tools button{min-height:44px;font-size:11px;padding:7px}#tools a{grid-column:1/-1;text-align:center;font-size:12px;padding:10px}#strategyDetails{margin-top:10px;border-top:1px solid #ffffff22;padding-top:8px;font-size:10px;line-height:1.6;color:#b9cddd}#count{display:block;color:#879dac;font-size:9px;margin-top:6px}#help{font-size:10px;line-height:1.5;color:#b9cddd;margin:8px 0 0}
#pilotControls{position:fixed;inset:0;pointer-events:none}#pilotStick,#heliTurn,#heliFire,#deployControls{position:absolute;pointer-events:auto}#pilotStick,#heliTurn,#heliFire{touch-action:none}#pilotStick{left:calc(env(safe-area-inset-left) + 14px);bottom:calc(env(safe-area-inset-bottom) + 14px);width:104px;height:104px;border:1px solid #c2e8ff80;border-radius:50%;background:#19355066}#pilotKnob{position:absolute;left:calc(50% - 18px);top:calc(50% - 18px);width:36px;height:36px;border-radius:50%;background:#b9e5ff99;border:1px solid #e2f6ff;pointer-events:none}
#heliFire{right:calc(env(safe-area-inset-right) + 14px);bottom:calc(env(safe-area-inset-bottom) + 16px);width:76px;height:76px;border-radius:50%;background:#a83e49d9;font-size:14px}#heliTurn{right:calc(env(safe-area-inset-right) + 100px);bottom:calc(env(safe-area-inset-bottom) + 18px);width:54px;height:54px;border-radius:50%;font-size:10px;padding:4px;background:#285e88cc}
#deployControls{right:calc(env(safe-area-inset-right) + 164px);bottom:calc(env(safe-area-inset-bottom) + 16px);display:flex;flex-direction:column;gap:7px}#deployControls button{display:flex;align-items:center;justify-content:center;flex-direction:column;width:46px;height:46px;padding:4px;border-radius:12px;background:#1b4668d9}#deployControls .rocket{background:#73532cd9}#deployControls svg{width:25px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}#deployControls small{font-size:9px;line-height:11px}
@media(orientation:landscape){#pilotStick{width:96px;height:96px}#battleHUD{top:calc(env(safe-area-inset-top) + 8px)}#economies>div,#pilotStatus{font-size:10px}}
@media(max-width:420px){#battleHUD{gap:3px;left:8px;flex-wrap:wrap}#economies{gap:3px}#economies>div,#pilotStatus{padding:2px 4px;font-size:9px}}
dialog{max-width:min(90vw,420px);border:1px solid #91aec7;border-radius:14px;background:#14283d;color:#eef7ff;padding:20px;touch-action:auto}dialog::backdrop{background:#000a}dialog p{font-size:15px;line-height:1.5}dialog form{text-align:right}html:fullscreen,html:-webkit-full-screen{background:#101b2c}
</style></head><body>
<canvas id="field"></canvas>
<div id="battleHUD"><div id="economies"><div id="blueEconomy" role="status" aria-label="Blue supply and troops"></div><div id="redEconomy" role="status" aria-label="Red supply and troops"></div></div><div id="pilotStatus" role="status">Hull 100</div></div>
<details id="gameMenu"><summary id="menuToggle" aria-label="Game menu">☰</summary><div id="menuPanel"><header><b>ChopperJohn</b> · Battlefield v1.1.0</header><div id="tools"><button id="pause">Pause</button><button id="fullscreen" aria-pressed="false">Fullscreen</button><button id="followHelicopter">Follow heli</button><button id="followRockets">Follow rockets</button><button id="jumpBlue">Blue FOB</button><button id="jumpRed">Red FOB</button><button id="reset">Reset</button><a href="./index.html">Flight School ↗</a></div><div id="strategyDetails"><div id="blueStrategy"></div><div id="redStrategy"></div><span id="count"></span></div><p id="help">Stick: pitch/lift · FIRE · TURN<br>Keyboard: WASD / arrows · Space / T<br>Blue troops: manual purchases only<br>Gun: 120 rounds · park to rearm +30/s<br>Replacement: 90 supply after 10s</p></div></details>
<div id="pilotControls"><div id="pilotStick" role="group" aria-label="Flight joystick"><div id="pilotKnob"></div></div><div id="deployControls"><button class="rocket" id="blueRocket" aria-label="Deploy rocket soldier · 60 supply"><svg viewBox="0 0 28 24" aria-hidden="true"><circle cx="10" cy="5" r="3"/><path d="M9 9v7m0-3-5 4m5-1-3 6m3-6 5 6M11 10l7-3M7 11l8-4M12 5l11-3 2 4-11 3z"/></svg><small>60</small></button><button id="blueRifle" aria-label="Deploy rifle soldier · 25 supply"><svg viewBox="0 0 28 24" aria-hidden="true"><circle cx="10" cy="5" r="3"/><path d="M9 9v7m0-3-5 4m5-1-3 6m3-6 5 6M10 11l8 3m-4-3 10 3m-6-1-1 4"/></svg><small>25</small></button></div><button id="heliTurn" aria-label="Turn helicopter">↻ TURN</button><button id="heliFire" aria-label="Fire helicopter machine gun">FIRE</button></div>
<dialog id="fullscreenHelp" aria-labelledby="fullscreenTitle"><h2 id="fullscreenTitle">Fullscreen play</h2><p id="fullscreenMessage"></p><form method="dialog"><button>Got it</button></form></dialog>
<script type="module" src="./js/battlefield/battlefieldScene.js?v=1.1.0"></script></body></html>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><title>ChopperJohn | Battlefield</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#101b2c;font-family:system-ui,-apple-system,sans-serif;color:#eef7ff;touch-action:none}canvas{display:block;width:100vw;height:100dvh;touch-action:none}
#top{position:fixed;top:env(safe-area-inset-top);left:0;right:0;display:flex;gap:8px;align-items:center;justify-content:space-between;padding:9px 12px;background:#0b1727d8;font-size:12px}
a{color:#b8e1ff}#tools{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 12px);left:8px;right:8px;display:flex;gap:7px;flex-wrap:wrap;justify-content:center}
button{border:1px solid #91aec7;border-radius:10px;background:#1b4668e8;color:white;padding:11px 13px;font-weight:700;touch-action:manipulation}
button.rocket{background:#73532cdd}button.red{background:#793b46e8}button.active{outline:3px solid #f1d16d}
#help{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 65px);left:50%;transform:translateX(-50%);padding:5px 10px;border-radius:8px;background:#0b1727c8;font-size:11px;white-space:nowrap;pointer-events:none}
@media(max-width:580px){button{font-size:11px;padding:9px 7px}#help{font-size:10px;bottom:calc(env(safe-area-inset-bottom) + 90px)}#top{font-size:11px}}
</style></head><body>
<canvas id="field"></canvas>
<div id="top"><span><b>ChopperJohn · Battlefield prototype</b> <span id="count"></span></span><span><a href="./index.html">Flight School</a> · <a href="#" id="reset">Reset</a></span></div>
<div id="help">Drag battlefield to pan · Tap a forward base to deploy its garrison</div>
<div id="tools"><button id="blueRifle">+ Blue rifle</button><button class="rocket" id="blueRocket">+ Blue rocket</button><button class="red" id="redRifle">+ Red rifle</button><button class="red rocket" id="redRocket">+ Red rocket</button><button id="pause">Pause</button></div>
<script>
(()=>{
"use strict";
const cv=document.getElementById("field"),ctx=cv.getContext("2d"),W=3600,GROUND=460,HEAD_Y=427,DT=1/60;
let viewW=innerWidth,viewH=innerHeight,ratio=1,scale=1,camera=0,dragId=null,lastPointerX=0,dragDistance=0,acc=0,last=0,time=0,paused=false,units=[],bases=[],nextId=1;
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
function resize(){viewW=innerWidth;viewH=innerHeight;ratio=Math.min(devicePixelRatio||1,2);cv.width=Math.round(viewW*ratio);cv.height=Math.round(viewH*ratio);scale=Math.max(.58,Math.min(viewH/585,1.35));camera=clamp(camera,0,Math.max(0,W-viewW/scale));}
function spawn(team,type,x){units.push({id:nextId++,team,type,x,y:GROUND,phase:Math.random()*6.28,velocity:(type==="rifle"?47:33)*(team===0?1:-1),state:"march",timer:0});}
function reset(){units=[];nextId=1;time=0;camera=0;paused=false;document.getElementById("pause").textContent="Pause";bases=[{x:110,team:0,main:true},{x:W-110,team:1,main:true},{x:1120,team:0,main:false,garrison:3},{x:W-1120,team:1,main:false,garrison:3}];for(let i=0;i<3;i++){spawn(0,"rifle",220+i*36);spawn(1,"rifle",W-220-i*36);}spawn(0,"rocket",170);spawn(1,"rocket",W-170);}
function command(team,type){const hq=team===0?200:W-200;spawn(team,type,hq);}
function deploy(b){if(b.main||b.garrison<=0)return;spawn(b.team,b.garrison%2===0?"rocket":"rifle",b.x+(b.team===0?50:-50));b.garrison--;}
function update(dt){if(paused)return;time+=dt;for(const u of units){u.timer+=dt;const enemy=units.find(e=>e.team!==u.team&&Math.abs(e.x-u.x)<49);if(enemy){u.state="hold";}else{u.state="march";u.x=clamp(u.x+u.velocity*dt,170,W-170);}u.phase+=dt*(u.type==="rifle"?10.5:8);}}
function soldier(u){
const blue=u.team===0,dir=blue?1:-1,primary=blue?"#a9e8fb":"#ffc0b4",accent=blue?"#2984b4":"#c25852";
const stride=u.state==="march"?Math.sin(u.phase)*8:0,arm=u.state==="march"?Math.sin(u.phase)*5:0;
ctx.save();ctx.translate(u.x,GROUND);ctx.scale(dir,1);ctx.lineCap="round";ctx.lineJoin="round";ctx.lineWidth=3.3;ctx.strokeStyle=primary;
ctx.beginPath();ctx.moveTo(0,-24);ctx.lineTo(0,-6);ctx.moveTo(0,-6);ctx.lineTo(-6+stride,0);ctx.moveTo(0,-6);ctx.lineTo(7-stride,0);ctx.stroke();
ctx.fillStyle=primary;ctx.beginPath();ctx.arc(0,-32,6,0,Math.PI*2);ctx.fill();
ctx.strokeStyle=accent;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-5,-39);ctx.lineTo(5,-39);ctx.stroke();
ctx.strokeStyle=primary;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,-23);ctx.lineTo(-7,-14+arm*.25);ctx.moveTo(0,-23);ctx.lineTo(11,-19-arm*.25);ctx.stroke();
if(u.type==="rifle"){ctx.fillStyle="#3d4348";ctx.fillRect(6,-24,24,4);ctx.fillRect(10,-20,5,9);ctx.fillStyle="#dfbc80";ctx.fillRect(24,-24,7,2);}
else{ctx.fillStyle="#656c5c";ctx.fillRect(3,-36,29,8);ctx.fillStyle="#b7a88a";ctx.fillRect(23,-38,8,3);ctx.strokeStyle=primary;ctx.beginPath();ctx.moveTo(-2,-24);ctx.lineTo(8,-31);ctx.stroke();}
ctx.restore();
}
function structure(b){ctx.save();ctx.translate(b.x,GROUND);const blue=b.team===0,color=blue?"#397cb0":"#ae5e5b";ctx.fillStyle="#1c2933";ctx.fillRect(-58,0,116,10);
if(b.main){ctx.fillStyle=color;ctx.fillRect(-55,-135,110,135);ctx.fillStyle="#253b50";ctx.fillRect(-38,-110,76,50);ctx.fillStyle="#b7d5e0";for(let j=0;j<3;j++)ctx.fillRect(-31+j*24,-96,13,17);ctx.fillStyle=color;ctx.fillRect(-35,-162,70,27);ctx.fillRect(-5,-197,10,35);ctx.fillStyle=blue?"#a5dfff":"#ffc0b5";ctx.font="bold 18px system-ui";ctx.textAlign="center";ctx.fillText(blue?"BLUE HQ":"RED HQ",0,-210);}
else{ctx.fillStyle="#7c8a7a";ctx.fillRect(-50,-70,100,70);ctx.fillStyle=color;ctx.fillRect(-56,-80,112,14);ctx.fillStyle="#1c2a36";ctx.fillRect(-14,-42,28,42);ctx.fillStyle=blue?"#a5dfff":"#ffc0b5";ctx.font="bold 14px system-ui";ctx.textAlign="center";ctx.fillText("FOB · "+b.garrison,0,-93);ctx.fillStyle="#d7dfcc";ctx.font="11px system-ui";ctx.fillText("TAP TO DEPLOY",0,-110);}
ctx.restore();}
function draw(){ctx.setTransform(ratio,0,0,ratio,0,0);ctx.clearRect(0,0,viewW,viewH);
ctx.fillStyle="#152a43";ctx.fillRect(0,0,viewW,viewH);ctx.save();const offsetY=Math.max(0,(viewH-(GROUND+85)*scale)/2);ctx.translate(0,offsetY);ctx.scale(scale,scale);ctx.translate(-camera,0);
const visible=viewW/scale;ctx.fillStyle="#2f4b5d";for(let i=0;i<26;i++){const x=i*170;ctx.beginPath();ctx.ellipse(x,GROUND-20+(i%4)*8,120,90,0,0,Math.PI*2);ctx.fill();}
ctx.fillStyle="#4e7254";ctx.fillRect(camera,GROUND,visible+5,100);ctx.fillStyle="#79946c";ctx.fillRect(camera,GROUND,visible+5,7);
ctx.fillStyle="#d8e0c8";for(let x=Math.floor(camera/100)*100;x<camera+visible+100;x+=100)ctx.fillRect(x,GROUND+16,35,3);
bases.forEach(structure);units.forEach(soldier);ctx.restore();
document.getElementById("count").textContent=" · "+units.length+" soldiers";
}
function frame(ts){let dt=Math.min((ts-last)/1000||0,.06);last=ts;acc=Math.min(acc+dt,.2);while(acc>=DT){update(DT);acc-=DT;}draw();requestAnimationFrame(frame);}
cv.addEventListener("pointerdown",e=>{dragId=e.pointerId;lastPointerX=e.clientX;dragDistance=0;cv.setPointerCapture(e.pointerId);});
cv.addEventListener("pointermove",e=>{if(e.pointerId!==dragId)return;const dx=e.clientX-lastPointerX;dragDistance+=Math.abs(dx);camera=clamp(camera-dx/scale,0,Math.max(0,W-viewW/scale));lastPointerX=e.clientX;});
cv.addEventListener("pointerup",e=>{if(e.pointerId!==dragId)return;if(dragDistance<14){const rect=cv.getBoundingClientRect();const offsetY=Math.max(0,(viewH-(GROUND+85)*scale)/2);const x=camera+(e.clientX-rect.left)/scale,y=(e.clientY-rect.top-offsetY)/scale;const b=bases.find(b=>!b.main&&Math.abs(b.x-x)<75&&y>GROUND-140&&y<GROUND+20);if(b)deploy(b);}dragId=null;});
cv.addEventListener("pointercancel",()=>dragId=null);
for(const [id,team,type] of [["blueRifle",0,"rifle"],["blueRocket",0,"rocket"],["redRifle",1,"rifle"],["redRocket",1,"rocket"]])document.getElementById(id).addEventListener("click",()=>command(team,type));
document.getElementById("pause").addEventListener("click",e=>{paused=!paused;e.target.textContent=paused?"Resume":"Pause";});
document.getElementById("reset").addEventListener("click",e=>{e.preventDefault();reset();});
addEventListener("resize",resize);
addEventListener("keydown",e=>{if(e.key==="ArrowRight")camera=clamp(camera+130,0,W-viewW/scale);if(e.key==="ArrowLeft")camera=clamp(camera-130,0,W-viewW/scale);});
resize();reset();requestAnimationFrame(frame);
})();
</script></body></html>
